name: ai-command-console-staging

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_command_console}
      POSTGRES_USER: ${POSTGRES_USER:-ai_command_console}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in staging.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      target: migrate
    env_file: staging.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ai_command_console}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_command_console}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      target: web
    env_file: staging.env
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-ai_command_console}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_command_console}?schema=public
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - app-data:/var/lib/ai-command-console
      - app-logs:/app/logs
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    env_file: staging.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ai_command_console}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_command_console}?schema=public
      JOB_QUEUE_EXECUTION_MODE: external
    volumes:
      - app-data:/var/lib/ai-command-console
      - app-logs:/app/logs
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  app-data:
  app-logs:
