name: ai-command-console-staging

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_command_console}
      POSTGRES_USER: ${POSTGRES_USER:-ai_command_console}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in staging.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.staging
      target: migrate
    env_file: ${STAGING_ENV_FILE:-staging.env}
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in staging.env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile.staging
      target: web
    env_file: ${STAGING_ENV_FILE:-staging.env}
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in staging.env}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - app-data:/var/lib/ai-command-console
      - app-logs:/app/logs
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    # The web process owns the in-process queue used by the default staging
    # configuration. Running this separate worker requires an explicit,
    # reviewed opt-in because its legacy autonomous execution path is
    # quarantined in production.
    profiles: ["external-worker"]
    build:
      context: .
      dockerfile: Dockerfile.staging
      target: worker
    env_file: ${STAGING_ENV_FILE:-staging.env}
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in staging.env}
      JOB_QUEUE_EXECUTION_MODE: external
    volumes:
      - app-data:/var/lib/ai-command-console
      - app-logs:/app/logs
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  app-data:
  app-logs:
