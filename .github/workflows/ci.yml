name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-validation:
    name: Repository Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Restore locked validation dependencies
        run: npm ci --ignore-scripts
      - name: Audit production Node dependencies
        run: npm run audit:dependencies:root && npm run audit:dependencies:web
      - name: Audit development dependency exceptions
        run: npm run audit:dependencies:development && npm run test:dependency-audit-policy
      - name: Scan tracked tree for secret leakage
        run: npm run validate:secrets
      - name: Qualify Part II configuration
        run: npm run repo -- validate configuration
      - name: Validate repository policy
        run: npm run repo -- validate repo
      - name: Verify canonical command contracts
        run: npm run test:repository-commands
      - name: Verify CI workflow contract
        run: npm run test:ci-workflow
      - name: Verify release workflow contract
        run: npm run test:release-workflows

  frontend-validation:
    name: Frontend Validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_APP_NAME: Proprium
      NEXT_PUBLIC_APP_VERSION: ci
      NEXT_PUBLIC_API_BASE_URL: https://api.ci.example
      NEXT_PUBLIC_ENVIRONMENT: test
      GP35_FRONTEND_SECRET_SENTINEL: gp35-server-only-ci-test-only-sentinel
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Restore locked frontend dependencies
        run: npm ci
        working-directory: apps/web
      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Validate frontend source
        run: npm run repo -- validate frontend
      - name: Build frontend
        run: npm run repo -- build frontend
      - name: Scan browser artifacts for secret leakage
        run: npm run test:secret-isolation
        working-directory: apps/web
      - name: Build Storybook
        run: npm run repo -- build storybook
      - name: Test Storybook accessibility and interactions
        run: npm run test:storybook
        working-directory: apps/web
      - name: Test application browser shell
        run: npm run test:browser
        working-directory: apps/web
      - name: Verify invalid build configuration fails closed
        run: npm run test:config-build-failure
        working-directory: apps/web

  backend-validation:
    name: Backend Validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Restore locked validation dependencies
        run: npm ci --ignore-scripts
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore backend dependencies
        run: dotnet restore services/api/Proprium.sln
      - name: Audit backend dependencies
        run: npm run audit:dependencies:dotnet
      - name: Validate backend source and architecture
        run: npm run repo -- validate backend
      - name: Run backend unit tests
        run: npm run backend:test:unit
      - name: Export canonical permissions
        run: dotnet run --project services/api/Proprium.Api --configuration Release --no-build --no-restore -- --export-permissions ../permissions.json
      - name: Verify permission catalog is current
        run: git diff --exit-code -- services/api/permissions.json

  integration-validation:
    name: Integration Validation
    needs: backend-validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASPNETCORE_ENVIRONMENT: Test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 55432
      POSTGRES_DATABASE: proprium
      POSTGRES_USER: proprium
      POSTGRES_PASSWORD: change-me
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      SESSION_TOKEN_DIGEST_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      SESSION_LIFETIME_MINUTES: 480
      AUTH_ALLOWED_ORIGIN: http://localhost
      LOGIN_RATE_LIMIT_PRIVACY_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      LOGIN_RATE_LIMIT_SOURCE: 10
      LOGIN_RATE_LIMIT_IDENTIFIER_SOURCE: 5
      LOGIN_RATE_LIMIT_WINDOW_MINUTES: 5
      LOGIN_RATE_LIMIT_FALLBACK_CAPACITY: 10000
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore integration dependencies
        run: dotnet restore services/api/Proprium.IntegrationTests/Proprium.IntegrationTests.csproj
      - name: Build integration tests
        run: dotnet build services/api/Proprium.IntegrationTests/Proprium.IntegrationTests.csproj --configuration Release --no-restore
      - name: Start dependencies and apply canonical migrations
        run: npm run repo -- migrate
      - name: Run classified integration tests
        run: npm run backend:test:integration
      - name: Capture infrastructure diagnostics
        if: failure()
        run: docker compose -f docker-compose.proprium.yml logs --no-color
      - name: Clean integration infrastructure
        if: always()
        run: docker compose -f docker-compose.proprium.yml down --volumes --remove-orphans

  docker-validation:
    name: Docker Validation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Validate Compose and image builds
        run: npm run repo -- validate docker

  openapi-validation:
    name: OpenAPI Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore OpenAPI generator dependencies
        run: dotnet restore services/api/Proprium.Api/Proprium.Api.csproj
      - name: Build OpenAPI generator
        run: dotnet build services/api/Proprium.Api/Proprium.Api.csproj --configuration Release --no-restore
      - name: Generate and validate OpenAPI
        run: npm run repo -- validate openapi

  health-validation:
    name: Health Validation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Start application stack and wait for readiness
        run: npm run repo -- dev
      - name: Validate application health contract
        run: npm run repo -- health
      - name: Write PostgreSQL persistence sentinel
        run: >-
          docker compose -f docker-compose.proprium.yml exec -T postgres
          psql -U proprium -d proprium -v ON_ERROR_STOP=1
          -c "INSERT INTO platform_metadata (\"Id\", \"Key\", \"Value\", \"CreatedAtUtc\") VALUES ('00000000-0000-0000-0000-000000000004', 'ci.persistence', 'before-restart', CURRENT_TIMESTAMP);"
      - name: Restart PostgreSQL and wait for readiness
        run: |
          docker compose -f docker-compose.proprium.yml restart postgres
          docker compose -f docker-compose.proprium.yml up --detach --wait postgres
      - name: Verify persistence and application readiness
        run: |
          test "$(docker compose -f docker-compose.proprium.yml exec -T postgres psql -U proprium -d proprium -Atc "SELECT \"Value\" FROM platform_metadata WHERE \"Key\" = 'ci.persistence';" | tr -d '\r')" = "before-restart"
          npm run repo -- health
      - name: Capture application diagnostics
        if: failure()
        run: docker compose -f docker-compose.proprium.yml logs --no-color
      - name: Clean application infrastructure
        if: always()
        run: docker compose -f docker-compose.proprium.yml down --volumes --remove-orphans
