name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-validation:
    name: repository-validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate:repository

  frontend-validation:
    name: frontend-validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_APP_NAME: Proprium
      NEXT_PUBLIC_APP_VERSION: ci
      NEXT_PUBLIC_API_BASE_URL: https://api.ci.example
      NEXT_PUBLIC_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run validate
      - run: npm run storybook:build
      - run: npm run test:storybook
      - run: npm run test:browser
      - run: npm run test:config-build-failure
      - run: npm run build

  backend-validation:
    name: backend-validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore services/api/Proprium.sln
      - run: dotnet build services/api/Proprium.sln --configuration Release --no-restore
      - run: dotnet format services/api/Proprium.sln --verify-no-changes --no-restore
      - run: dotnet test services/api/Proprium.sln --configuration Release --no-build --filter "Category!=Integration"
      - run: dotnet run --project services/api/Proprium.Api --configuration Release --no-build -- --export-permissions ../permissions.json
      - run: git diff --exit-code -- services/api/permissions.json
      - run: dotnet run --project services/api/Proprium.Api --configuration Release --no-build -- --write-openapi "$RUNNER_TEMP/proprium-openapi.json"
      - run: node scripts/validate-openapi.cjs "$RUNNER_TEMP/proprium-openapi.json"

  integration-validation:
    name: integration-validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_NAME: Proprium
      APP_ENVIRONMENT: Test
      APP_VERSION: ci
      ASPNETCORE_ENVIRONMENT: Test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 55432
      POSTGRES_DATABASE: proprium
      POSTGRES_USER: proprium
      POSTGRES_PASSWORD: change-me
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore services/api/Proprium.IntegrationTests/Proprium.IntegrationTests.csproj
      - run: docker compose -f docker-compose.proprium.yml up --detach --wait postgres redis
      - run: docker compose -f docker-compose.proprium.yml up --build --exit-code-from database-migrations database-migrations
      - run: dotnet test services/api/Proprium.IntegrationTests/Proprium.IntegrationTests.csproj --configuration Release --filter "Category=Integration"
      - if: failure()
        run: docker compose -f docker-compose.proprium.yml logs --no-color
      - if: always()
        run: docker compose -f docker-compose.proprium.yml down --volumes --remove-orphans

  docker-validation:
    name: docker-validation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - run: docker compose -f docker-compose.proprium.yml up --build --detach --wait
      - run: curl --fail --retry 5 --retry-connrefused http://localhost:8080/api/v1/health/live
      - run: curl --fail --retry 5 --retry-connrefused http://localhost:8080/api/v1/health/ready
      - run: curl --fail --retry 5 --retry-connrefused http://localhost:3000/health
      - if: failure()
        run: docker compose -f docker-compose.proprium.yml logs --no-color
      - if: always()
        run: docker compose -f docker-compose.proprium.yml down --volumes --remove-orphans
