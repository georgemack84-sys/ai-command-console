name: Reclaim Proprium Staging Disk

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proprium-staging-maintenance
  cancel-in-progress: false

jobs:
  reclaim:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - name: Reclaim unused Docker artifacts
        shell: bash
        run: |
          set -euo pipefail
          for value in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do
            test -n "${!value}"
          done
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${DEPLOY_PORT:-22}" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '## Disk before cleanup'
          df -h / /var/lib/docker 2>/dev/null || df -h /
          echo
          echo '## Docker usage before cleanup'
          docker system df
          echo
          echo '## Reclaiming unused build cache and unused images'
          docker builder prune --all --force
          docker image prune --all --force
          echo
          echo '## Disk after cleanup'
          df -h / /var/lib/docker 2>/dev/null || df -h /
          echo
          echo '## Docker usage after cleanup'
          docker system df
          REMOTE
