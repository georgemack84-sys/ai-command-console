name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      target_environment:
        description: Deployment target environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      rollback_release:
        description: Existing release version to reactivate instead of building a new one
        required: false
        type: string

jobs:
  package:
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch') ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'staging' }}
    env:
      AI_COMMAND_CONSOLE_AUTH_SECRET: ci-placeholder-secret
      AI_COMMAND_CONSOLE_STORAGE_DRIVER: sqlite
      AI_COMMAND_CONSOLE_DATABASE_PATH: ./data/workspace.sqlite
      AI_COMMAND_CONSOLE_AGENTS_DATABASE_PATH: ./data/agents/console.sqlite
      AI_COMMAND_CONSOLE_SECURE_COOKIES: true
      AI_COMMAND_CONSOLE_SESSION_MAX_AGE_SECONDS: 1209600
      DEPLOY_ARTIFACT_ONLY: ${{ vars.DEPLOY_ARTIFACT_ONLY }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_RESTART_COMMAND: ${{ vars.DEPLOY_RESTART_COMMAND }}
      DEPLOY_HEALTHCHECK_URL: ${{ vars.DEPLOY_HEALTHCHECK_URL }}
      DEPLOY_HEALTHCHECK_PATH: ${{ vars.DEPLOY_HEALTHCHECK_PATH }}
      DEPLOY_HEALTHCHECK_ATTEMPTS: ${{ vars.DEPLOY_HEALTHCHECK_ATTEMPTS }}
      DEPLOY_HEALTHCHECK_DELAY_SECONDS: ${{ vars.DEPLOY_HEALTHCHECK_DELAY_SECONDS }}
      DEPLOY_VALIDATION_PATHS: ${{ vars.DEPLOY_VALIDATION_PATHS }}
      DEPLOY_RELEASE_RETENTION: ${{ vars.DEPLOY_RELEASE_RETENTION }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_TELEMETRY_DIR: artifacts/deployment-telemetry
      DH_ENFORCEMENT_MODE: ${{ vars.DH_ENFORCEMENT_MODE || 'warn_only' }}
      DH_OVERRIDE_MODE: ${{ vars.DH_OVERRIDE_MODE || 'request_only' }}
      DH_OVERRIDE_ARTIFACT_PATH: ${{ vars.DH_OVERRIDE_ARTIFACT_PATH || 'release-evidence/override-authorization.json' }}

    steps:
      - name: Resolve deployment metadata
        id: metadata
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            TARGET_ENVIRONMENT="staging"
            SOURCE_REF="${{ github.event.workflow_run.head_branch }}"
            SOURCE_SHA="${{ github.event.workflow_run.head_sha }}"
            RELEASE_VERSION="${{ github.event.workflow_run.head_sha }}"
            ROLLBACK_RELEASE=""
          else
            TARGET_ENVIRONMENT="${{ inputs.target_environment }}"
            SOURCE_REF="${GITHUB_REF_NAME}"
            SOURCE_SHA="${GITHUB_SHA}"
            RELEASE_VERSION="${GITHUB_SHA}"
            ROLLBACK_RELEASE="${{ inputs.rollback_release }}"
            if [ -n "$ROLLBACK_RELEASE" ]; then
              RELEASE_VERSION="$ROLLBACK_RELEASE"
            fi
          fi

          if [ -n "$ROLLBACK_RELEASE" ] && [ "$TARGET_ENVIRONMENT" != "production" ]; then
            echo "Rollback is only supported for manual production deploys."
            exit 1
          fi

          {
            echo "target_environment=$TARGET_ENVIRONMENT"
            echo "source_ref=$SOURCE_REF"
            echo "source_sha=$SOURCE_SHA"
            echo "release_version=$RELEASE_VERSION"
            echo "rollback_release=$ROLLBACK_RELEASE"
          } >> "$GITHUB_OUTPUT"

      - name: Check out repository
        if: ${{ steps.metadata.outputs.rollback_release == '' }}
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.metadata.outputs.source_sha }}

      - name: Emit deployment telemetry start
        if: ${{ steps.metadata.outputs.rollback_release == '' }}
        continue-on-error: true
        run: node scripts/deploy-telemetry.cjs emit --event deploy_start --step "Check out repository" --partition checkout --state RUNNING --certificateStatus UNVERIFIED

      - name: Emit certificate verification telemetry start
        if: ${{ steps.metadata.outputs.rollback_release == '' }}
        continue-on-error: true
        run: node scripts/deploy-telemetry.cjs emit --event certificate_verify_start --step "Certificate verification" --partition certificate_verify --lastCompletedPartition checkout --state PROGRESSING --certificateStatus UNVERIFIED

      - name: Verify deployment certificate
        id: certificate_verify
        if: ${{ steps.metadata.outputs.rollback_release == '' }}
        continue-on-error: true
        run: node scripts/deploy-certificate-verify.cjs verify --certificate release-evidence/certificate.json --commit "${{ steps.metadata.outputs.source_sha }}" --workflowRunId "${{ github.run_id }}"

      - name: Emit certificate verification telemetry complete
        if: ${{ steps.metadata.outputs.rollback_release == '' }}
        continue-on-error: true
        run: node scripts/deploy-telemetry.cjs emit --event certificate_verify_complete --step "Certificate verification" --partition certificate_verify --lastCompletedPartition certificate_verify --state "${{ steps.certificate_verify.outputs.telemetry_state || 'DISPUTED' }}" --certificateStatus "${{ steps.certificate_verify.outputs.certificate_status || 'DISPUTED' }}" --failureClass "${{ steps.certificate_verify.outputs.failure_class }}"

      - name: Emit certificate verification telemetry disputed
        if: ${{ steps.metadata.outputs.rollback_release == '' && steps.certificate_verify.outputs.certificate_status != 'VALID' }}
        continue-on-error: true
        run: node scripts/deploy-telemetry.cjs emit --event certificate_verify_disputed --step "Certificate verification" --partition certificate_verify --lastCompletedPartition certificate_verify --state DISPUTED --certificateStatus "${{ steps.certificate_verify.outputs.certificate_status || 'DISPUTED' }}" --failureClass "${{ steps.certificate_verify.outputs.failure_class || 'UNKNOWN_FAILURE' }}"

      - name: Emit certificate verification telemetry failed
        if: ${{ steps.metadata.outputs.rollback_release == '' && steps.certificate_verify.outcome == 'failure' }}
        continue-on-error: true
        run: node scripts/deploy-telemetry.cjs emit --event certificate_verify_failed --step "Certificate verification" --partition certificate_verify --lastCompletedPartition certificate_verify --state DISPUTED --certificateStatus DISPUTED --failureClass UNKNOWN_FAILURE

      - name: Emit checkpoint validation telemetry start
        if: ${{ steps.metadata.outputs.rollback_release == '' }}
        continue-on-error: true
        run: node scripts/deploy-telemetry.cjs emit --event checkpoint_validate_start --step "Checkpoint validation" --partition checkpoint_validate --lastCompletedPartition certificate_verify --state PROGRESSING --certificateStatus "${{ steps.certificate_verify.outputs.certificate_status || 'UNVERIFIED' }}" --checkpointStatus UNVERIFIED --resumeEligibility UNVERIFIED

      - name: Validate deployment checkpoint
        id: checkpoint_validate
        if: ${{ steps.metadata.outputs.rollback_release == '' }}
        continue-on-error: true
        run: node scripts/deploy-checkpoint-validate.cjs verify --checkpoint .codex-temp/test-release-progress.json --commit "${{ steps.metadata.outputs.source_sha }}" --workflowRunId "${{ github.run_id }}" --certificateStatus "${{ steps.certificate_verify.outputs.certificate_status || 'UNVERIFIED' }}" --certificateId "${{ steps.certificate_verify.outputs.certificate_hash }}" --certificateHash "${{ steps.certificate_verify.outputs.certificate_hash }}"

      - name: Emit checkpoint validation telemetry complete
        if: ${{ steps.metadata.outputs.rollback_release == '' }}
        continue-on-error: true
        run: node scripts/deploy-telemetry.cjs emit --event checkpoint_validate_complete --step "Checkpoint validation" --partition checkpoint_validate --lastCompletedPartition checkpoint_validate --state "${{ steps.checkpoint_validate.outputs.telemetry_state || 'DISPUTED' }}" --certificateStatus "${{ steps.certificate_verify.outputs.certificate_status || 'UNVERIFIED' }}" --checkpointStatus "${{ steps.checkpoint_validate.outputs.checkpoint_status || 'DISPUTED' }}" --resumeEligibility "${{ steps.checkpoint_validate.outputs.resume_eligibility || 'DISPUTED' }}" --checkpointHash "${{ steps.checkpoint_validate.outputs.checkpoint_hash }}" --environmentHash "${{ steps.checkpoint_validate.outputs.environment_hash }}" --failureClass "${{ steps.checkpoint_validate.outputs.failure_class }}"

      - name: Emit checkpoint validation telemetry disputed
        if: ${{ steps.metadata.outputs.rollback_release == '' && steps.checkpoint_validate.outputs.checkpoint_status != 'SAFE' && steps.checkpoint_validate.outputs.checkpoint_status != 'NO_CHECKPOINT' }}
        continue-on-error: true
        run: node scripts/deploy-telemetry.cjs emit --event checkpoint_validate_disputed --step "Checkpoint validation" --partition checkpoint_validate --lastCompletedPartition checkpoint_validate --state DISPUTED --certificateStatus "${{ steps.certificate_verify.outputs.certificate_status || 'UNVERIFIED' }}" --checkpointStatus "${{ steps.checkpoint_validate.outputs.checkpoint_status || 'DISPUTED' }}" --resumeEligibility "${{ steps.checkpoint_validate.outputs.resume_eligibility || 'DISPUTED' }}" --checkpointHash "${{ steps.checkpoint_validate.outputs.checkpoint_hash }}" --environmentHash "${{ steps.checkpoint_validate.outputs.environment_hash }}" --failureClass "${{ steps.checkpoint_validate.outputs.failure_class || 'UNKNOWN_FAILURE' }}"

      - name: Emit checkpoint validation telemetry failed
        if: ${{ steps.metadata.outputs.rollback_release == '' && steps.checkpoint_validate.outcome == 'failure' }}
        continue-on-error: true
        run: node scripts/deploy-telemetry.cjs emit --event checkpoint_validate_failed --step "Checkpoint validation" --partition checkpoint_validate --lastCompletedPartition checkpoint_validate --state DISPUTED --certificateStatus "${{ steps.certificate_verify.outputs.certificate_status || 'UNVERIFIED' }}" --checkpointStatus DISPUTED --resumeEligibility DISPUTED --failureClass UNKNOWN_FAILURE

      - name: Emit resume analysis telemetry complete
        if: ${{ steps.metadata.outputs.rollback_release == '' }}
        continue-on-error: true
        run: node scripts/deploy-telemetry.cjs emit --event resume_analysis_complete --step "Resume analysis" --partition resume_analysis --lastCompletedPartition checkpoint_validate --state "${{ steps.checkpoint_validate.outputs.telemetry_state || 'DISPUTED' }}" --certificateStatus "${{ steps.certificate_verify.outputs.certificate_status || 'UNVERIFIED' }}" --checkpointStatus "${{ steps.checkpoint_validate.outputs.checkpoint_status || 'DISPUTED' }}" --resumeEligibility "${{ steps.checkpoint_validate.outputs.resume_eligibility || 'DISPUTED' }}" --checkpointHash "${{ steps.checkpoint_validate.outputs.checkpoint_hash }}" --environmentHash "${{ steps.checkpoint_validate.outputs.environment_hash }}" --failureClass "${{ steps.checkpoint_validate.outputs.failure_class }}"

      - name: Emit deployment decision telemetry start
        if: ${{ steps.metadata.outputs.rollback_release == '' }}
        continue-on-error: true
        run: node scripts/deploy-telemetry.cjs emit --event deployment_decision_start --step "Deployment decision" --partition deployment_decision --lastCompletedPartition resume_analysis --state PROGRESSING --certificateStatus "${{ steps.certificate_verify.outputs.certificate_status || 'UNVERIFIED' }}" --checkpointStatus "${{ steps.checkpoint_validate.outputs.checkpoint_status || 'UNVERIFIED' }}" --resumeEligibility "${{ steps.checkpoint_validate.outputs.resume_eligibility || 'UNVERIFIED' }}" --checkpointHash "${{ steps.checkpoint_validate.outputs.checkpoint_hash }}" --environmentHash "${{ steps.checkpoint_validate.outputs.environment_hash }}" --deploymentDecision DISPUTED --deploymentRisk UNKNOWN --decisionPolicyVersion dh-deployment-decision/v1 --decisionReasons "DECISION_NOT_EVALUATED"

      - name: Evaluate deployment decision
        id: deployment_decision
        if: ${{ steps.metadata.outputs.rollback_release == '' }}
        continue-on-error: true
        run: node scripts/deploy-decision-engine.cjs evaluate --evidence-dir artifacts/deployment-telemetry --output-dir artifacts/deployment-telemetry

      - name: Emit deployment decision telemetry complete
        if: ${{ steps.metadata.outputs.rollback_release == '' }}
        continue-on-error: true
        run: node scripts/deploy-telemetry.cjs emit --event deployment_decision_complete --step "Deployment decision" --partition deployment_decision --lastCompletedPartition deployment_decision --state "${{ steps.deployment_decision.outputs.telemetry_state || 'DISPUTED' }}" --certificateStatus "${{ steps.certificate_verify.outputs.certificate_status || 'UNVERIFIED' }}" --checkpointStatus "${{ steps.checkpoint_validate.outputs.checkpoint_status || 'UNVERIFIED' }}" --resumeEligibility "${{ steps.checkpoint_validate.outputs.resume_eligibility || 'UNVERIFIED' }}" --checkpointHash "${{ steps.checkpoint_validate.outputs.checkpoint_hash }}" --environmentHash "${{ steps.checkpoint_validate.outputs.environment_hash }}" --failureClass "${{ steps.deployment_decision.outputs.failure_class }}" --deploymentDecision "${{ steps.deployment_decision.outputs.deployment_decision || 'DISPUTED' }}" --deploymentRisk "${{ steps.deployment_decision.outputs.deployment_risk || 'UNKNOWN' }}" --decisionPolicyVersion "${{ steps.deployment_decision.outputs.decision_policy_version || 'dh-deployment-decision/v1' }}" --decisionReasons "${{ steps.deployment_decision.outputs.decision_reasons }}"

      - name: Emit deployment decision telemetry disputed
        if: ${{ steps.metadata.outputs.rollback_release == '' && steps.deployment_decision.outputs.deployment_decision == 'DISPUTED' }}
        continue-on-error: true
        run: node scripts/deploy-telemetry.cjs emit --event deployment_decision_disputed --step "Deployment decision" --partition deployment_decision --lastCompletedPartition deployment_decision --state DISPUTED --certificateStatus "${{ steps.certificate_verify.outputs.certificate_status || 'UNVERIFIED' }}" --checkpointStatus "${{ steps.checkpoint_validate.outputs.checkpoint_status || 'DISPUTED' }}" --resumeEligibility "${{ steps.checkpoint_validate.outputs.resume_eligibility || 'DISPUTED' }}" --checkpointHash "${{ steps.checkpoint_validate.outputs.checkpoint_hash }}" --environmentHash "${{ steps.checkpoint_validate.outputs.environment_hash }}" --failureClass "${{ steps.deployment_decision.outputs.failure_class || 'UNKNOWN_FAILURE' }}" --deploymentDecision DISPUTED --deploymentRisk UNKNOWN --decisionPolicyVersion "${{ steps.deployment_decision.outputs.decision_policy_version || 'dh-deployment-decision/v1' }}" --decisionReasons "${{ steps.deployment_decision.outputs.decision_reasons }}"

      - name: Emit deployment decision telemetry failed
        if: ${{ steps.metadata.outputs.rollback_release == '' && steps.deployment_decision.outcome == 'failure' }}
        continue-on-error: true
        run: node scripts/deploy-telemetry.cjs emit --event deployment_decision_failed --step "Deployment decision" --partition deployment_decision --lastCompletedPartition deployment_decision --state DISPUTED --certificateStatus "${{ steps.certificate_verify.outputs.certificate_status || 'UNVERIFIED' }}" --checkpointStatus DISPUTED --resumeEligibility DISPUTED --failureClass UNKNOWN_FAILURE --deploymentDecision DISPUTED --deploymentRisk UNKNOWN --decisionPolicyVersion dh-deployment-decision/v1 --decisionReasons "DECISION_ENGINE_ERROR"

      - name: Emit scoped enforcement telemetry start
        if: ${{ steps.metadata.outputs.rollback_release == '' }}
        continue-on-error: true
        run: node scripts/deploy-telemetry.cjs emit --event scoped_enforcement_start --step "Scoped enforcement" --partition scoped_enforcement --lastCompletedPartition deployment_decision --state PROGRESSING --certificateStatus "${{ steps.certificate_verify.outputs.certificate_status || 'UNVERIFIED' }}" --checkpointStatus "${{ steps.checkpoint_validate.outputs.checkpoint_status || 'UNVERIFIED' }}" --resumeEligibility "${{ steps.checkpoint_validate.outputs.resume_eligibility || 'UNVERIFIED' }}" --checkpointHash "${{ steps.checkpoint_validate.outputs.checkpoint_hash }}" --environmentHash "${{ steps.checkpoint_validate.outputs.environment_hash }}" --failureClass "${{ steps.deployment_decision.outputs.failure_class }}" --deploymentDecision "${{ steps.deployment_decision.outputs.deployment_decision || 'DISPUTED' }}" --deploymentRisk "${{ steps.deployment_decision.outputs.deployment_risk || 'UNKNOWN' }}" --decisionPolicyVersion "${{ steps.deployment_decision.outputs.decision_policy_version || 'dh-deployment-decision/v1' }}" --decisionReasons "${{ steps.deployment_decision.outputs.decision_reasons }}" --enforcementMode "${{ env.DH_ENFORCEMENT_MODE }}" --enforcementDecision WARN_CONTINUE --enforcementPolicyVersion dh-scoped-enforcement/v1 --enforcementReasons "ENFORCEMENT_NOT_EVALUATED" --blocked false

      - name: Evaluate scoped enforcement
        id: scoped_enforcement
        if: ${{ steps.metadata.outputs.rollback_release == '' }}
        continue-on-error: true
        run: node scripts/deploy-enforcement-gate.cjs evaluate --evidence-dir artifacts/deployment-telemetry --output-dir artifacts/deployment-telemetry --mode "${{ env.DH_ENFORCEMENT_MODE }}"

      - name: Emit scoped enforcement telemetry complete
        if: ${{ always() && steps.metadata.outputs.rollback_release == '' && steps.scoped_enforcement.outcome == 'success' }}
        continue-on-error: true
        run: node scripts/deploy-telemetry.cjs emit --event scoped_enforcement_complete --step "Scoped enforcement" --partition scoped_enforcement --lastCompletedPartition scoped_enforcement --state "${{ steps.scoped_enforcement.outputs.telemetry_state || 'PROGRESSING' }}" --certificateStatus "${{ steps.certificate_verify.outputs.certificate_status || 'UNVERIFIED' }}" --checkpointStatus "${{ steps.checkpoint_validate.outputs.checkpoint_status || 'UNVERIFIED' }}" --resumeEligibility "${{ steps.checkpoint_validate.outputs.resume_eligibility || 'UNVERIFIED' }}" --checkpointHash "${{ steps.checkpoint_validate.outputs.checkpoint_hash }}" --environmentHash "${{ steps.checkpoint_validate.outputs.environment_hash }}" --failureClass "${{ steps.deployment_decision.outputs.failure_class }}" --deploymentDecision "${{ steps.deployment_decision.outputs.deployment_decision || 'DISPUTED' }}" --deploymentRisk "${{ steps.deployment_decision.outputs.deployment_risk || 'UNKNOWN' }}" --decisionPolicyVersion "${{ steps.deployment_decision.outputs.decision_policy_version || 'dh-deployment-decision/v1' }}" --decisionReasons "${{ steps.deployment_decision.outputs.decision_reasons }}" --enforcementMode "${{ steps.scoped_enforcement.outputs.enforcement_mode || 'WARN_ONLY' }}" --enforcementDecision "${{ steps.scoped_enforcement.outputs.enforcement_decision || 'WARN_CONTINUE' }}" --enforcementPolicyVersion "${{ steps.scoped_enforcement.outputs.enforcement_policy_version || 'dh-scoped-enforcement/v1' }}" --enforcementReasons "${{ steps.scoped_enforcement.outputs.enforcement_reasons }}" --deterministicCauses "${{ steps.scoped_enforcement.outputs.deterministic_causes }}" --blocked "${{ steps.scoped_enforcement.outputs.blocked || 'false' }}"

      - name: Emit scoped enforcement telemetry warn
        if: ${{ always() && steps.metadata.outputs.rollback_release == '' && steps.scoped_enforcement.outputs.enforcement_decision == 'WARN_CONTINUE' }}
        continue-on-error: true
        run: node scripts/deploy-telemetry.cjs emit --event scoped_enforcement_warn --step "Scoped enforcement" --partition scoped_enforcement --lastCompletedPartition scoped_enforcement --state PROGRESSING --certificateStatus "${{ steps.certificate_verify.outputs.certificate_status || 'UNVERIFIED' }}" --checkpointStatus "${{ steps.checkpoint_validate.outputs.checkpoint_status || 'UNVERIFIED' }}" --resumeEligibility "${{ steps.checkpoint_validate.outputs.resume_eligibility || 'UNVERIFIED' }}" --failureClass "${{ steps.deployment_decision.outputs.failure_class }}" --deploymentDecision "${{ steps.deployment_decision.outputs.deployment_decision || 'DISPUTED' }}" --deploymentRisk "${{ steps.deployment_decision.outputs.deployment_risk || 'UNKNOWN' }}" --enforcementMode "${{ steps.scoped_enforcement.outputs.enforcement_mode || 'WARN_ONLY' }}" --enforcementDecision WARN_CONTINUE --enforcementPolicyVersion "${{ steps.scoped_enforcement.outputs.enforcement_policy_version || 'dh-scoped-enforcement/v1' }}" --enforcementReasons "${{ steps.scoped_enforcement.outputs.enforcement_reasons }}" --deterministicCauses "${{ steps.scoped_enforcement.outputs.deterministic_causes }}" --blocked false

      - name: Emit scoped enforcement telemetry blocked
        if: ${{ always() && steps.metadata.outputs.rollback_release == '' && steps.scoped_enforcement.outputs.blocked == 'true' }}
        continue-on-error: true
        run: node scripts/deploy-telemetry.cjs emit --event scoped_enforcement_blocked --step "Scoped enforcement" --partition scoped_enforcement --lastCompletedPartition scoped_enforcement --state BLOCKED --certificateStatus "${{ steps.certificate_verify.outputs.certificate_status || 'UNVERIFIED' }}" --checkpointStatus "${{ steps.checkpoint_validate.outputs.checkpoint_status || 'UNVERIFIED' }}" --resumeEligibility "${{ steps.checkpoint_validate.outputs.resume_eligibility || 'UNVERIFIED' }}" --failureClass "${{ steps.deployment_decision.outputs.failure_class }}" --deploymentDecision "${{ steps.deployment_decision.outputs.deployment_decision || 'BLOCK_RECOMMENDED' }}" --deploymentRisk "${{ steps.deployment_decision.outputs.deployment_risk || 'CRITICAL' }}" --enforcementMode "${{ steps.scoped_enforcement.outputs.enforcement_mode || 'ENFORCE_SCOPED' }}" --enforcementDecision ENFORCE_BLOCK --enforcementPolicyVersion "${{ steps.scoped_enforcement.outputs.enforcement_policy_version || 'dh-scoped-enforcement/v1' }}" --enforcementReasons "${{ steps.scoped_enforcement.outputs.enforcement_reasons }}" --deterministicCauses "${{ steps.scoped_enforcement.outputs.deterministic_causes }}" --blocked true

      - name: Emit scoped enforcement telemetry disputed
        if: ${{ always() && steps.metadata.outputs.rollback_release == '' && steps.scoped_enforcement.outputs.enforcement_decision == 'DISPUTED_NO_BLOCK' }}
        continue-on-error: true
        run: node scripts/deploy-telemetry.cjs emit --event scoped_enforcement_disputed --step "Scoped enforcement" --partition scoped_enforcement --lastCompletedPartition scoped_enforcement --state DISPUTED --certificateStatus "${{ steps.certificate_verify.outputs.certificate_status || 'UNVERIFIED' }}" --checkpointStatus "${{ steps.checkpoint_validate.outputs.checkpoint_status || 'DISPUTED' }}" --resumeEligibility "${{ steps.checkpoint_validate.outputs.resume_eligibility || 'DISPUTED' }}" --failureClass "${{ steps.deployment_decision.outputs.failure_class || 'UNKNOWN_FAILURE' }}" --deploymentDecision "${{ steps.deployment_decision.outputs.deployment_decision || 'DISPUTED' }}" --deploymentRisk "${{ steps.deployment_decision.outputs.deployment_risk || 'UNKNOWN' }}" --enforcementMode "${{ steps.scoped_enforcement.outputs.enforcement_mode || 'WARN_ONLY' }}" --enforcementDecision DISPUTED_NO_BLOCK --enforcementPolicyVersion "${{ steps.scoped_enforcement.outputs.enforcement_policy_version || 'dh-scoped-enforcement/v1' }}" --enforcementReasons "${{ steps.scoped_enforcement.outputs.enforcement_reasons }}" --deterministicCauses "${{ steps.scoped_enforcement.outputs.deterministic_causes }}" --blocked false

      - name: Emit scoped enforcement telemetry failed
        if: ${{ always() && steps.metadata.outputs.rollback_release == '' && steps.scoped_enforcement.outcome == 'failure' && steps.scoped_enforcement.outputs.blocked != 'true' }}
        continue-on-error: true
        run: node scripts/deploy-telemetry.cjs emit --event scoped_enforcement_failed --step "Scoped enforcement" --partition scoped_enforcement --lastCompletedPartition scoped_enforcement --state DISPUTED --certificateStatus "${{ steps.certificate_verify.outputs.certificate_status || 'UNVERIFIED' }}" --checkpointStatus DISPUTED --resumeEligibility DISPUTED --failureClass UNKNOWN_FAILURE --deploymentDecision DISPUTED --deploymentRisk UNKNOWN --enforcementMode "${{ steps.scoped_enforcement.outputs.enforcement_mode || 'WARN_ONLY' }}" --enforcementDecision DISPUTED_NO_BLOCK --enforcementPolicyVersion dh-scoped-enforcement/v1 --enforcementReasons "SCOPED_ENFORCEMENT_STEP_ERROR" --blocked false

      - name: Emit operator override telemetry start
        if: ${{ always() && steps.metadata.outputs.rollback_release == '' }}
        continue-on-error: true
        run: node scripts/deploy-telemetry.cjs emit --event operator_override_start --step "Operator override governance" --partition operator_override --lastCompletedPartition scoped_enforcement --state "${{ steps.scoped_enforcement.outputs.telemetry_state || 'PROGRESSING' }}" --certificateStatus "${{ steps.certificate_verify.outputs.certificate_status || 'UNVERIFIED' }}" --checkpointStatus "${{ steps.checkpoint_validate.outputs.checkpoint_status || 'UNVERIFIED' }}" --resumeEligibility "${{ steps.checkpoint_validate.outputs.resume_eligibility || 'UNVERIFIED' }}" --failureClass "${{ steps.deployment_decision.outputs.failure_class }}" --deploymentDecision "${{ steps.deployment_decision.outputs.deployment_decision || 'DISPUTED' }}" --deploymentRisk "${{ steps.deployment_decision.outputs.deployment_risk || 'UNKNOWN' }}" --enforcementMode "${{ steps.scoped_enforcement.outputs.enforcement_mode || 'WARN_ONLY' }}" --enforcementDecision "${{ steps.scoped_enforcement.outputs.enforcement_decision || 'WARN_CONTINUE' }}" --enforcementPolicyVersion "${{ steps.scoped_enforcement.outputs.enforcement_policy_version || 'dh-scoped-enforcement/v1' }}" --enforcementReasons "${{ steps.scoped_enforcement.outputs.enforcement_reasons }}" --deterministicCauses "${{ steps.scoped_enforcement.outputs.deterministic_causes }}" --blocked "${{ steps.scoped_enforcement.outputs.blocked || 'false' }}" --overrideMode "${{ env.DH_OVERRIDE_MODE }}" --overrideDecision NO_OVERRIDE --overridePolicyVersion dh-override-governance/v1 --overrideReasons "OVERRIDE_NOT_EVALUATED" --sourceEnforcementDecision "${{ steps.scoped_enforcement.outputs.enforcement_decision || 'WARN_CONTINUE' }}" --sourceBlocked "${{ steps.scoped_enforcement.outputs.blocked || 'false' }}"

      - name: Evaluate override governance
        id: operator_override
        if: ${{ always() && steps.metadata.outputs.rollback_release == '' }}
        run: node scripts/deploy-override-governance.cjs evaluate --evidence-dir artifacts/deployment-telemetry --output-dir artifacts/deployment-telemetry --override "${{ env.DH_OVERRIDE_ARTIFACT_PATH }}" --mode "${{ env.DH_OVERRIDE_MODE }}"

      - name: Emit operator override telemetry complete
