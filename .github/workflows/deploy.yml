        continue-on-error: true
        run: node scripts/deploy-telemetry.cjs emit --event preflight_start --step "Run preflight" --partition preflight --lastCompletedPartition deploy_config --state PROGRESSING --certificateStatus "${{ steps.certificate_verify.outputs.certificate_status || 'UNVERIFIED' }}"

      - name: Run preflight
        if: ${{ steps.metadata.outputs.rollback_release == '' }}
        run: npm run preflight

      - name: Emit preflight telemetry complete
        if: ${{ steps.metadata.outputs.rollback_release == '' }}
        continue-on-error: true
        run: node scripts/deploy-telemetry.cjs emit --event preflight_complete --step "Run preflight" --partition preflight --lastCompletedPartition preflight --state PROGRESSING --certificateStatus "${{ steps.certificate_verify.outputs.certificate_status || 'UNVERIFIED' }}"

      - name: Lint
        if: ${{ steps.metadata.outputs.rollback_release == '' }}
        run: npm run lint

      - name: Emit release test telemetry start
        if: ${{ steps.metadata.outputs.rollback_release == '' }}
        continue-on-error: true
        run: node scripts/deploy-telemetry.cjs emit --event release_test_start --step "Test" --partition test:release --lastCompletedPartition lint --state PROGRESSING --certificateStatus "${{ steps.certificate_verify.outputs.certificate_status || 'UNVERIFIED' }}"

      - name: Emit release test telemetry heartbeat
        if: ${{ steps.metadata.outputs.rollback_release == '' }}
        continue-on-error: true
        run: node scripts/deploy-telemetry.cjs emit --event release_test_running --step "Test" --partition test:release --lastCompletedPartition lint --state PROGRESSING --certificateStatus "${{ steps.certificate_verify.outputs.certificate_status || 'UNVERIFIED' }}"

      - name: Test
        if: ${{ steps.metadata.outputs.rollback_release == '' }}
        run: npm run test:release

      - name: Emit release test telemetry complete
        if: ${{ steps.metadata.outputs.rollback_release == '' }}
        continue-on-error: true
        run: node scripts/deploy-telemetry.cjs emit --event release_test_complete --step "Test" --partition test:release --lastCompletedPartition test:release --state PROGRESSING --certificateStatus "${{ steps.certificate_verify.outputs.certificate_status || 'UNVERIFIED' }}"

      - name: Emit build telemetry start
        if: ${{ steps.metadata.outputs.rollback_release == '' }}
        continue-on-error: true
        run: node scripts/deploy-telemetry.cjs emit --event build_start --step "Build standalone bundle" --partition build --lastCompletedPartition test:release --state PROGRESSING --certificateStatus "${{ steps.certificate_verify.outputs.certificate_status || 'UNVERIFIED' }}"

      - name: Build standalone bundle
        if: ${{ steps.metadata.outputs.rollback_release == '' }}
        env:
          NODE_ENV: production
        run: npm run build

      - name: Emit build telemetry complete
        if: ${{ steps.metadata.outputs.rollback_release == '' }}
        continue-on-error: true
        run: node scripts/deploy-telemetry.cjs emit --event build_complete --step "Build standalone bundle" --partition build --lastCompletedPartition build --state PROGRESSING --certificateStatus "${{ steps.certificate_verify.outputs.certificate_status || 'UNVERIFIED' }}"

      - name: Emit bundle telemetry start
        if: ${{ steps.metadata.outputs.rollback_release == '' }}
        continue-on-error: true
        run: node scripts/deploy-telemetry.cjs emit --event bundle_start --step "Assemble deploy bundle" --partition bundle --lastCompletedPartition build --state PROGRESSING --certificateStatus "${{ steps.certificate_verify.outputs.certificate_status || 'UNVERIFIED' }}"

      - name: Assemble deploy bundle
        if: ${{ steps.metadata.outputs.rollback_release == '' }}
        shell: bash
        run: |
          rm -rf release
          mkdir -p release
          cp -R .next/standalone/. release/
          mkdir -p release/.next
          cp -R .next/static release/.next/static
          if [ -d public ]; then cp -R public release/public; fi
          if [ -d data ]; then cp -R data release/data; fi
          if [ -d logs ]; then cp -R logs release/logs; fi
          cp package.json release/package.json
          cp README.md release/README.md
          cp .env.example release/.env.example
          cat <<EOF > release/RELEASE.txt
          release_version=${{ steps.metadata.outputs.release_version }}
          source_ref=${{ steps.metadata.outputs.source_ref }}
          source_sha=${{ steps.metadata.outputs.source_sha }}
          built_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          EOF
          tar -czf "ai-command-console-release-${{ steps.metadata.outputs.release_version }}.tgz" -C release .

      - name: Emit bundle telemetry complete
        if: ${{ steps.metadata.outputs.rollback_release == '' }}
        continue-on-error: true
        run: node scripts/deploy-telemetry.cjs emit --event bundle_complete --step "Assemble deploy bundle" --partition bundle --lastCompletedPartition bundle --state PROGRESSING --certificateStatus "${{ steps.certificate_verify.outputs.certificate_status || 'UNVERIFIED' }}" --artifact "ai-command-console-release-${{ steps.metadata.outputs.release_version }}.tgz"

      - name: Emit artifact upload telemetry start
        if: ${{ steps.metadata.outputs.rollback_release == '' }}
        continue-on-error: true
        run: node scripts/deploy-telemetry.cjs emit --event artifact_upload_start --step "Upload deploy bundle" --partition artifact_upload --lastCompletedPartition bundle --state PROGRESSING --certificateStatus "${{ steps.certificate_verify.outputs.certificate_status || 'UNVERIFIED' }}" --artifact "ai-command-console-release-${{ steps.metadata.outputs.release_version }}.tgz"

      - name: Upload deploy bundle
        if: ${{ steps.metadata.outputs.rollback_release == '' }}
        uses: actions/upload-artifact@v6
        with:
          name: ai-command-console-release-${{ steps.metadata.outputs.release_version }}
          path: ai-command-console-release-${{ steps.metadata.outputs.release_version }}.tgz
          if-no-files-found: error

      - name: Emit artifact upload telemetry complete
        if: ${{ steps.metadata.outputs.rollback_release == '' }}
        continue-on-error: true
        run: node scripts/deploy-telemetry.cjs emit --event artifact_upload_complete --step "Upload deploy bundle" --partition artifact_upload --lastCompletedPartition artifact_upload --state PROGRESSING --certificateStatus "${{ steps.certificate_verify.outputs.certificate_status || 'UNVERIFIED' }}" --artifact "ai-command-console-release-${{ steps.metadata.outputs.release_version }}.tgz"

      - name: Emit SSH deploy telemetry start
        if: ${{ vars.DEPLOY_ARTIFACT_ONLY != 'true' && steps.metadata.outputs.rollback_release == '' }}
        continue-on-error: true
        run: node scripts/deploy-telemetry.cjs emit --event ssh_deploy_start --step "Deploy over SSH" --partition ssh_deploy --lastCompletedPartition artifact_upload --state PROGRESSING --certificateStatus "${{ steps.certificate_verify.outputs.certificate_status || 'UNVERIFIED' }}"

      - name: Deploy over SSH
        if: ${{ vars.DEPLOY_ARTIFACT_ONLY != 'true' }}
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_RESTART_COMMAND: ${{ vars.DEPLOY_RESTART_COMMAND }}
          DEPLOY_HEALTHCHECK_URL: ${{ vars.DEPLOY_HEALTHCHECK_URL }}
          DEPLOY_HEALTHCHECK_PATH: ${{ vars.DEPLOY_HEALTHCHECK_PATH }}
          DEPLOY_HEALTHCHECK_ATTEMPTS: ${{ vars.DEPLOY_HEALTHCHECK_ATTEMPTS }}
          DEPLOY_HEALTHCHECK_DELAY_SECONDS: ${{ vars.DEPLOY_HEALTHCHECK_DELAY_SECONDS }}
          DEPLOY_RELEASE_RETENTION: ${{ vars.DEPLOY_RELEASE_RETENTION }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          RELEASE_ROOT="${DEPLOY_PATH}/releases"
          RELEASE_PATH="${RELEASE_ROOT}/${{ steps.metadata.outputs.release_version }}"
          CURRENT_PATH="${DEPLOY_PATH}/current"

          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${DEPLOY_PORT:-22}" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          if [ -z "${{ steps.metadata.outputs.rollback_release }}" ]; then
            scp -i ~/.ssh/deploy_key -P "${DEPLOY_PORT:-22}" "ai-command-console-release-${{ steps.metadata.outputs.release_version }}.tgz" "$DEPLOY_USER@$DEPLOY_HOST:/tmp/ai-command-console-release-${{ steps.metadata.outputs.release_version }}.tgz"
            ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" "\
              mkdir -p '$DEPLOY_PATH' '$RELEASE_ROOT' && \
              rm -rf '$RELEASE_PATH' && \
              mkdir -p '$RELEASE_PATH' && \
              tar -xzf '/tmp/ai-command-console-release-${{ steps.metadata.outputs.release_version }}.tgz' -C '$RELEASE_PATH' && \
              rm -f '/tmp/ai-command-console-release-${{ steps.metadata.outputs.release_version }}.tgz' && \
              ln -sfn '$RELEASE_PATH' '$CURRENT_PATH' && \
              if [ -n \"$DEPLOY_RESTART_COMMAND\" ]; then eval \"$DEPLOY_RESTART_COMMAND\"; fi"
          else
            ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" "\
              test -d '$RELEASE_PATH' && \
              ln -sfn '$RELEASE_PATH' '$CURRENT_PATH' && \
              if [ -n \"$DEPLOY_RESTART_COMMAND\" ]; then eval \"$DEPLOY_RESTART_COMMAND\"; fi"
          fi

      - name: Emit SSH deploy telemetry complete
        if: ${{ vars.DEPLOY_ARTIFACT_ONLY != 'true' && steps.metadata.outputs.rollback_release == '' }}
        continue-on-error: true
        run: node scripts/deploy-telemetry.cjs emit --event ssh_deploy_complete --step "Deploy over SSH" --partition ssh_deploy --lastCompletedPartition ssh_deploy --state PROGRESSING --certificateStatus "${{ steps.certificate_verify.outputs.certificate_status || 'UNVERIFIED' }}"

      - name: Emit smoke telemetry start
        if: ${{ vars.DEPLOY_ARTIFACT_ONLY != 'true' && steps.metadata.outputs.rollback_release == '' }}
        continue-on-error: true
        run: node scripts/deploy-telemetry.cjs emit --event smoke_start --step "Post-deploy smoke check" --partition smoke --lastCompletedPartition ssh_deploy --state PROGRESSING --certificateStatus "${{ steps.certificate_verify.outputs.certificate_status || 'UNVERIFIED' }}"

      - name: Post-deploy smoke check
        if: ${{ vars.DEPLOY_ARTIFACT_ONLY != 'true' }}
        env:
          DEPLOY_HEALTHCHECK_URL: ${{ vars.DEPLOY_HEALTHCHECK_URL }}
          DEPLOY_HEALTHCHECK_PATH: ${{ vars.DEPLOY_HEALTHCHECK_PATH }}
          DEPLOY_HEALTHCHECK_ATTEMPTS: ${{ vars.DEPLOY_HEALTHCHECK_ATTEMPTS }}
          DEPLOY_HEALTHCHECK_DELAY_SECONDS: ${{ vars.DEPLOY_HEALTHCHECK_DELAY_SECONDS }}
          DEPLOY_VALIDATION_PATHS: ${{ vars.DEPLOY_VALIDATION_PATHS }}
        run: |
          if [ -z "$DEPLOY_VALIDATION_PATHS" ] && [ -n "$DEPLOY_HEALTHCHECK_PATH" ]; then
            export DEPLOY_VALIDATION_PATHS="$DEPLOY_HEALTHCHECK_PATH"
          fi
          npm run validate:deploy

      - name: Emit smoke telemetry complete
        if: ${{ vars.DEPLOY_ARTIFACT_ONLY != 'true' && steps.metadata.outputs.rollback_release == '' }}
        continue-on-error: true
        run: node scripts/deploy-telemetry.cjs emit --event smoke_complete --step "Post-deploy smoke check" --partition smoke --lastCompletedPartition smoke --state PROGRESSING --certificateStatus "${{ steps.certificate_verify.outputs.certificate_status || 'UNVERIFIED' }}"

      - name: Prune old remote releases
        if: ${{ vars.DEPLOY_ARTIFACT_ONLY != 'true' }}
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_RELEASE_RETENTION: ${{ vars.DEPLOY_RELEASE_RETENTION }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          KEEP_RELEASES="${DEPLOY_RELEASE_RETENTION:-5}"
          if ! [[ "$KEEP_RELEASES" =~ ^[0-9]+$ ]] || [ "$KEEP_RELEASES" -lt 1 ]; then
            echo "DEPLOY_RELEASE_RETENTION must be a positive integer"
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${DEPLOY_PORT:-22}" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" "\
            RELEASE_ROOT='$DEPLOY_PATH/releases'; \
            CURRENT_PATH='$DEPLOY_PATH/current'; \
            KEEP_RELEASES='$KEEP_RELEASES'; \
            if [ ! -d \"\$RELEASE_ROOT\" ]; then exit 0; fi; \
            CURRENT_TARGET=\$(basename \"\$(readlink -f \"\$CURRENT_PATH\" 2>/dev/null || echo '')\"); \
            RELEASE_COUNT=0; \
            for RELEASE_DIR in \$(find \"\$RELEASE_ROOT\" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %f\n' | sort -nr | awk '{print \$2}'); do \
              RELEASE_COUNT=\$((RELEASE_COUNT + 1)); \
              if [ \"\$RELEASE_COUNT\" -le \"\$KEEP_RELEASES\" ] || [ \"\$RELEASE_DIR\" = \"\$CURRENT_TARGET\" ]; then \
                continue; \
              fi; \
              rm -rf \"\$RELEASE_ROOT/\$RELEASE_DIR\"; \
            done"

      - name: Emit deployment telemetry complete
        if: ${{ success() && steps.metadata.outputs.rollback_release == '' }}
        continue-on-error: true
        run: node scripts/deploy-telemetry.cjs emit --event deploy_complete --step "Summarize deployment" --partition complete --lastCompletedPartition smoke --state PASSED --certificateStatus "${{ steps.certificate_verify.outputs.certificate_status || 'UNVERIFIED' }}"

      - name: Emit deployment telemetry failed
        if: ${{ failure() && steps.metadata.outputs.rollback_release == '' }}
        continue-on-error: true
        run: node scripts/deploy-telemetry.cjs emit --event deploy_failed --step "Deploy workflow" --partition failed --state FAILED --failureSignal "deploy workflow failed" --certificateStatus "${{ steps.certificate_verify.outputs.certificate_status || 'UNVERIFIED' }}"

      - name: Upload deployment telemetry
        if: ${{ always() && steps.metadata.outputs.rollback_release == '' }}
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: deployment-telemetry-${{ steps.metadata.outputs.release_version }}
          path: artifacts/deployment-telemetry/
          if-no-files-found: ignore

      - name: Summarize deployment
        shell: bash
        run: |
          {
            echo "## Deployment Summary"
            echo ""
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Target environment: \`${{ steps.metadata.outputs.target_environment }}\`"
            echo "- Git ref: \`${{ steps.metadata.outputs.source_ref }}\`"
            echo "- Commit: \`${{ steps.metadata.outputs.source_sha }}\`"
            echo "- Release version: \`${{ steps.metadata.outputs.release_version }}\`"
            if [ -n "${{ steps.metadata.outputs.rollback_release }}" ]; then
              echo "- Mode: \`rollback\`"
            else
              echo "- Mode: \`build-and-deploy\`"
            fi
            if [ "${{ vars.DEPLOY_ARTIFACT_ONLY }}" = "true" ]; then
              echo "- Remote host: artifact-only mode"
            elif [ -n "${{ vars.DEPLOY_HOST }}" ]; then
              echo "- Remote host: \`${{ vars.DEPLOY_HOST }}\`"
            else
              echo "- Remote host: missing configuration"
            fi
            if [ -z "${{ steps.metadata.outputs.rollback_release }}" ]; then
              echo "- Artifact: \`ai-command-console-release-${{ steps.metadata.outputs.release_version }}.tgz\`"
            else
              echo "- Artifact: skipped for rollback"
            fi
            if [ -n "${{ vars.DEPLOY_RELEASE_RETENTION }}" ]; then
              echo "- Remote release retention: \`${{ vars.DEPLOY_RELEASE_RETENTION }}\`"
            else
              echo "- Remote release retention: \`5\` (default)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
