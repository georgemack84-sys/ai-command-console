name: ${COMPOSE_PROJECT_NAME:-proprium}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-proprium}
      POSTGRES_USER: ${POSTGRES_USER:-proprium}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports: ["${POSTGRES_HOST_PORT:-55432}:5432"]
    volumes: ["proprium-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["${REDIS_HOST_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  database-migrations:
    build:
      context: .
      dockerfile: services/api/Proprium.Api/Dockerfile
    command: ["--migrate"]
    environment: &platform_environment
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-proprium}
      POSTGRES_USER: ${POSTGRES_USER:-proprium}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      SESSION_TOKEN_DIGEST_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      SESSION_LIFETIME_MINUTES: 480
      AUTH_ALLOWED_ORIGIN: http://localhost:${WEB_PORT:-3000}
      LOGIN_RATE_LIMIT_PRIVACY_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      LOGIN_RATE_LIMIT_SOURCE: 10
      LOGIN_RATE_LIMIT_IDENTIFIER_SOURCE: 5
      LOGIN_RATE_LIMIT_WINDOW_MINUTES: 5
      LOGIN_RATE_LIMIT_FALLBACK_CAPACITY: 10000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: "no"

  platform-api:
    build:
      context: .
      dockerfile: services/api/Proprium.Api/Dockerfile
    restart: unless-stopped
    environment: *platform_environment
    ports: ["${API_PORT:-8080}:8080"]
    depends_on:
      database-migrations: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "dotnet", "Proprium.Api.dll", "--health-probe", "http://127.0.0.1:8080/api/v1/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_APP_NAME: Proprium
        NEXT_PUBLIC_APP_VERSION: 0.1.0
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-8080}
        NEXT_PUBLIC_ENVIRONMENT: development
    restart: unless-stopped
    ports: ["${WEB_PORT:-3000}:3000"]
    depends_on:
      platform-api: { condition: service_healthy }

volumes:
  proprium-postgres:
