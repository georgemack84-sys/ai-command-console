name: proprium

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: proprium
      POSTGRES_USER: proprium
      POSTGRES_PASSWORD: change-me
    ports: ["55432:5432"]
    volumes: ["proprium-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proprium -d proprium"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  database-migrations:
    build:
      context: .
      dockerfile: services/api/Proprium.Api/Dockerfile
    command: ["dotnet", "Proprium.Api.dll", "--migrate"]
    environment: &platform_environment
      APP_NAME: Proprium
      APP_ENVIRONMENT: Development
      APP_VERSION: 0.1.0
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: proprium
      POSTGRES_USER: proprium
      POSTGRES_PASSWORD: change-me
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: "no"

  platform-api:
    build:
      context: .
      dockerfile: services/api/Proprium.Api/Dockerfile
    environment: *platform_environment
    ports: ["8080:8080"]
    depends_on:
      database-migrations: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "dotnet", "Proprium.Api.dll", "--health-probe", "http://127.0.0.1:8080/api/v1/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_APP_NAME: Proprium
        NEXT_PUBLIC_APP_VERSION: 0.1.0
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
        NEXT_PUBLIC_ENVIRONMENT: development
    ports: ["3000:3000"]
    depends_on:
      platform-api: { condition: service_healthy }

volumes:
  proprium-postgres:
