http_port 3128
visible_hostname nuru-egress-proxy
pid_filename /var/run/squid/squid.pid
cache_log stdio:/dev/stderr
access_log stdio:/dev/stdout
cache_store_log none

# The worker has no route to the public network. This proxy may only reach
# approved public HTTP(S) domains and denies every other destination.
acl safe_ports port 80 443
acl ssl_ports port 443
acl allowed_domains dstdomain "/etc/squid/allowed-domains.txt"
acl private_destinations dst 0.0.0.0/8
acl private_destinations dst 10.0.0.0/8
acl private_destinations dst 100.64.0.0/10
acl private_destinations dst 127.0.0.0/8
acl private_destinations dst 169.254.0.0/16
acl private_destinations dst 172.16.0.0/12
acl private_destinations dst 192.0.0.0/24
acl private_destinations dst 192.0.2.0/24
acl private_destinations dst 192.168.0.0/16
acl private_destinations dst 198.18.0.0/15
acl private_destinations dst 198.51.100.0/24
acl private_destinations dst 203.0.113.0/24
acl private_destinations dst 224.0.0.0/4
acl private_destinations dst 240.0.0.0/4
acl private_destinations dst ::1/128
acl private_destinations dst fc00::/7
acl private_destinations dst fe80::/10
acl private_destinations dst ff00::/8

http_access deny !safe_ports
http_access deny CONNECT !ssl_ports
http_access deny private_destinations
http_access allow allowed_domains
http_access deny all

cache deny all
forwarded_for delete
via off
request_header_access X-Forwarded-For deny all
request_header_access Forwarded deny all
