name: day-to-day-assistant

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: ${D2D_POSTGRES_DB:-day_to_day_assistant}
      POSTGRES_USER: ${D2D_POSTGRES_USER:-d2d}
      POSTGRES_PASSWORD: ${D2D_POSTGRES_PASSWORD:-d2d_dev_password}
    ports:
      - "${D2D_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${D2D_POSTGRES_USER:-d2d} -d ${D2D_POSTGRES_DB:-day_to_day_assistant}"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      D2D_API_HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8010:8010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/api/v1/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      D2D_WEB_HOST: 0.0.0.0
      D2D_WEB_PORT: 5174
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5174:5174"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5174/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  postgres_data:
