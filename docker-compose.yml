services:
  api:
    build:
      context: .
      dockerfile: ./services/api/Proprium.Api/Dockerfile
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "dotnet", "Proprium.Api.dll", "--health-probe", "http://127.0.0.1:8080/api/v1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME}
        NEXT_PUBLIC_APP_VERSION: ${NEXT_PUBLIC_APP_VERSION}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_ENVIRONMENT: ${NEXT_PUBLIC_ENVIRONMENT}
    ports:
      - "3000:3000"

  postgres:
    image: postgres:16-alpine
    container_name: ai-command-console-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_command_console
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_command_console"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
